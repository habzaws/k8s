apiVersion: apps/v1
kind: ReplicaSet
metadata: 
  name: nginx-rs
  labels:
    purpose: understanding
spec:
  minReadySeconds: 5
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        version: v1.0
    spec:
      containers:
       - name: nginx
         image: nginx:1.14.2
         ports:
          - containerPort: 80

---
apiVersion: v1
kind: Service 
Metadata:
  name: nginx-svc
spec:
  selector:
    app: nginx
  ports:
   - name: nginx-port
     targetport: 80
     port: 80