apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: exercise
  labels:
    app: exercise
spec:
  minReadySeconds: 1
  replicas: 3
  selector: 
    matchExpressions:
      - key: activity
        operators: In 
        values: 
         - exercise
         - exercise2
  template: 
    metadata:
      labels:
        activity: exercise
    spec:
      containers:
       - name: incoma
         image: alpine

        